set_irrigation_strategy:
  description: Set VWC-based crop steering strategy for a growspace.
  fields:
    growspace_id:
      description: The ID of the growspace to configure.
      required: true
      selector:
        text:
    enabled:
      description: Whether the VWC-based irrigation strategy is enabled.
      required: false
      selector:
        boolean:
    lights_on_time:
      description: Lights on time (e.g., "06:00:00").
      required: false
      selector:
        text:
    p0_duration_minutes:
      description: Duration of Phase 0 in minutes.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "minutes"
    p2_stop_before_lights_off_minutes:
      description: Time to stop watering before lights off in minutes.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "minutes"
    target_vwc_percent:
      description: Target VWC percentage during Phase 1.
      required: false
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 0.1
          unit_of_measurement: "%"
    maintenance_dryback_percent:
      description: Dryback threshold in absolute VWC percentage points below target before maintenance shot during Phase 2.
      required: false
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 0.1
          unit_of_measurement: "%"
    p1_shot_duration_seconds:
      description: Duration of a single P1 (ramp-up) irrigation shot in seconds.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "seconds"
    p1_shot_interval_minutes:
      description: Minimum interval between P1 (ramp-up) shots in minutes.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "minutes"
    p2_shot_duration_seconds:
      description: Duration of a single P2 (maintenance) irrigation shot in seconds.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "seconds"
    p2_shot_interval_minutes:
      description: Minimum interval between P2 (maintenance) shots in minutes.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "minutes"
    shot_duration_seconds:
      description: Deprecated. Shared shot duration in seconds; sets both P1 and P2.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "seconds"
    shot_interval_minutes:
      description: Deprecated. Shared shot interval in minutes; sets both P1 and P2.
      required: false
      selector:
        number:
          min: 0
          unit_of_measurement: "minutes"
    dynamic_shot_enabled:
      description: Master toggle for Adaptive Shot Control — adapts both shot size and interval from the substrate's response to the previous shot.
      required: false
      selector:
        boolean:
    dynamic_aggressiveness:
      description: Overshoot correction strength. Higher values shrink the shot and lengthen the interval more sharply when a shot overshoots the VWC target.
      required: false
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
    dynamic_recovery:
      description: Undershoot recovery rate. How quickly the size and interval factors return to nominal when shots meet or fall short of target.
      required: false
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
    dynamic_shot_size_floor:
      description: Lower clamp on the shot size factor — the smallest fraction of the configured shot size adaptation may apply.
      required: false
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
    dynamic_interval_ceiling:
      description: Upper clamp on the interval factor — the largest multiple of the configured shot interval adaptation may apply.
      required: false
      selector:
        number:
          min: 1.0
          max: 5.0
          step: 0.1
    pore_ec_target_min:
      description: Lower edge of the Pore EC Target Band (mS/cm) that EC Modulation steers toward. Distinct from the per-stage feed EC range.
      required: false
      selector:
        number:
          min: 0.0
          step: 0.1
    pore_ec_target_max:
      description: Upper edge of the Pore EC Target Band (mS/cm) that EC Modulation steers toward. Must be above the lower edge.
      required: false
      selector:
        number:
          min: 0.0
          step: 0.1
    ec_modulation_enabled:
      description: Opt-in toggle for EC Modulation. When off (or the band/sensors are absent), the modulation factor is exactly 1.0.
      required: false
      selector:
        boolean:

