        text:

configure_exhaust_fan:
  description: Configure the exhaust fan controller for a growspace
  fields:
    growspace_id:
      description: ID of the growspace
      required: true
      selector:
        text:
    enabled:
      description: Enable the exhaust fan controller
      required: true
      selector:
        boolean:
    min_speed:
      description: Minimum exhaust fan speed (percent)
      required: true
      selector:
        number:
          min: 0
          max: 99
          unit_of_measurement: "%"
    max_speed:
      description: Maximum exhaust fan speed (percent)
      required: true
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    temperature_target:
      description: Target temperature
      required: true
      selector:
        number:
          min: 15
          max: 35
          step: 0.1
          unit_of_measurement: "°C"
    temperature_tolerance:
      description: Temperature tolerance band
      required: true
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          unit_of_measurement: "°C"
    humidity_target:
      description: Target relative humidity
      required: true
      selector:
        number:
          min: 20
          max: 90
          unit_of_measurement: "%"
    humidity_tolerance:
      description: Humidity tolerance band
      required: true
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: "%"
    vpd_target:
      description: Target vapour pressure deficit
      required: true
      selector:
        number:
          min: 0.1
          max: 3.0
          step: 0.01
          unit_of_measurement: kPa
    vpd_tolerance:
      description: VPD tolerance band
      required: true
      selector:
        number:
          min: 0.01
          max: 1.0
          step: 0.01
          unit_of_measurement: kPa
    stage_vpd_enabled:
      description: Resolve the VPD target from the active plant stage and day/night
      required: false
      selector:
        boolean:
    stage_vpd_overrides:
      description: Per-stage day/night VPD target overrides
      required: false
      selector:
        object:
    critical_temp_low:
      description: Low-temperature safety threshold (drives fan to minimum speed)
      required: false
      selector:
        number:
          min: 10
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
    critical_temp_high:
      description: High-temperature safety threshold (drives fan to maximum speed)
      required: false
      selector:
        number:
          min: 10
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
    critical_temp_hysteresis:
      description: Hysteresis applied before clearing a temperature safety override
      required: true
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          unit_of_measurement: "°C"

