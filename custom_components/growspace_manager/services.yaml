export_strain_library:
  description: Export the strain library and images to a ZIP file
  # No fields required

import_strain_library:
  description: Import a strain library from a ZIP file containing data and images
  fields:
    file_path:
      description: The full path to the ZIP file on the server (e.g. uploaded via Lovelace)
      required: false
      selector:
        text:
    zip_base64:
      description: Base64 encoded ZIP file content (used by frontend uploads)
      required: false
      selector:
        text:
    replace:
      description: If true, overwrite existing library. If false (default), merge.
      required: false
      default: false
      selector:
        boolean:

clear_strain_library:
  description: Clear all strains from the library
  # No fields required

get_strain_library:
  description: Get the full strain library data (for frontend use). Returns a dictionary with the strain library data.

add_growspace:
  description: Add a new growspace
  fields:
    name:
      description: Name of the growspace
      required: true
      selector:
        text:
    rows:
      description: Number of rows in the growspace
      required: true
      selector:
        number:
          min: 1
          max: 20
    plants_per_row:
      description: Number of plants per row
      required: true
      selector:
        number:
          min: 1
          max: 20
    notification_target:
      description: Notification service target (e.g., mobile_app_your_phone)
      required: false
      selector:
        text:

ask_grow_advice:
  description: Ask the Virtual Grow Master for advice on a specific growspace. Returns the advice text generated by the AI.
  fields:
    growspace_id:
      description: ID of the growspace to analyze
      required: true
      selector:
        text:
    user_query:
      description: Optional question to ask about the growspace
      required: false
      selector:
        text:
          multiline: true
    context_type:
      description: Type of advice context (general, diagnostic, optimization, planning)
      required: false
      default: "general"
      selector:
        select:
          options:
            - "general"
            - "diagnostic"
            - "optimization"
            - "planning"
    max_length:
      description: Maximum length for the response
      required: false
      selector:
        number:
          min: 50
          max: 2000

