---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: no-commit-to-branch
        args:
          # The main checkout sits on prerelease; this is what keeps commits
          # out of it now that the hooks no longer depend on a worktree's depth.
          - --branch=main
          - --branch=dev
          - --branch=prerelease
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        # Without this, prek/pre-commit also runs prettier during the commit-msg
        # stage — where "files" resolves to the commit message file itself — and
        # errors out with "No matching files", hard-blocking every commit. Only
        # surfaced once commit-msg was actually installed (see CLAUDE.md's fresh
        # workspace setup note); default_install_hook_types declares the stage,
        # each hook still needs its own restriction.
        stages: [pre-commit]
        additional_dependencies:
          - prettier@3.6.2
          - prettier-plugin-sort-json@4.2.0
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.6.0
    hooks:
      # Run `python-typing-update` hook manually from time to time
      # to update python typing syntax.
      # Will require manual work, before submitting changes!
      # pre-commit run --hook-stage manual python-typing-update --all-files
      - id: python-typing-update
        stages: [manual]
        args:
          - --py314-plus
          - --force
          - --keep-updates
        files: ^(custom_components|tests)/.+\.py$
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python3 .github/scripts/run_venv_tool.py ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        args: [--fix]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: python3 .github/scripts/run_venv_tool.py ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        files: ^(custom_components|tests)/.+\.(py|pyi)$
        require_serial: true
      - id: codespell
        name: codespell
        entry: python3 .github/scripts/run_venv_tool.py codespell
        language: system
        types: [text]
        args:
          - --ignore-words-list=hass,tage,trough
          - --quiet-level=2
        # Generated fixtures, captured output, and snapshots are not prose.
        exclude: >-
          (?x)^(
            custom_components/growspace_manager/
            (ruff_output\.txt|search_results\.html)
            |tests/fixtures/lovelace/growspace-manager-card\.js
            |tests/.+/snapshots/.+\.ambr
          )$
      - id: yamllint
        name: yamllint
        entry: python3 .github/scripts/run_venv_tool.py yamllint
        language: system
        types: [file, yaml]
      - id: pytest
        name: pytest
        entry: python3 .github/scripts/run_venv_tool.py pytest
        language: system
        pass_filenames: false
        types: [python]
        files: ^(custom_components|tests)/.+\.py$
      - id: mypy
        name: mypy
        entry: python3 .github/scripts/run_venv_tool.py mypy
        args: [--follow-imports=silent]
        language: system
        require_serial: true
        types_or: [python, pyi]
        files: ^custom_components/.+\.(py|pyi)$
