repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
        files: ^(custom_components|tests)/.+\.(py|pyi)$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=aiport,astroid,checkin,currenty,hass,iif,incomfort,lookin,nam,NotIn
          - --skip="./.*,*.csv,*.json,*.ambr"
          - --quiet-level=2
        exclude_types: [csv, json, html]
        exclude: ^tests/fixtures/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=dev
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        # Without this, prek/pre-commit also runs prettier during the commit-msg
        # stage — where "files" resolves to the commit message file itself — and
        # errors out with "No matching files", hard-blocking every commit. Only
        # surfaced once commit-msg was actually installed (see CLAUDE.md's fresh
        # workspace setup note); default_install_hook_types declares the stage,
        # each hook still needs its own restriction.
        stages: [pre-commit]
        additional_dependencies:
          - prettier@3.6.2
          - prettier-plugin-sort-json@4.2.0
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.6.0
    hooks:
      # Run `python-typing-update` hook manually from time to time
      # to update python typing syntax.
      # Will require manual work, before submitting changes!
      # pre-commit run --hook-stage manual python-typing-update --all-files
      - id: python-typing-update
        stages: [manual]
        args:
          - --py314-plus
          - --force
          - --keep-updates
        files: ^(custom_components|tests)/.+\.py$
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: ../../.venv/bin/pytest
        language: system
        pass_filenames: false
        types: [python]
        files: ^(custom_components|tests)/.+\.py$
      - id: mypy
        name: mypy
        entry: ../../.venv/bin/mypy
        args: [custom_components/growspace_manager/]
        language: system
        pass_filenames: false
        require_serial: true
        types_or: [python, pyi]
        files: ^custom_components/.+\.(py|pyi)$
