services:
  # --- Existing Production/Dev Instance ---
  homeassistant-init:
    image: busybox
    volumes:
      - ha-config:/config
      - ./config/configuration.yaml:/tmp/configuration.yaml:ro
    command: sh -c "[ ! -f /config/configuration.yaml ] && cp /tmp/configuration.yaml /config/ || true; chown -R 1000:1000 /config; chmod -R 755 /config"

  homeassistant:
    container_name: homeassistant-dev
    image: homeassistant/home-assistant:stable
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - homeassistant-init
    environment:
      - TZ=America/Chicago
    volumes:
      - ha-config:/config
      - ./custom_components:/config/custom_components
      # Mount Lovelace card for auto-updates
      - ../lovelace-growspace-manager-card/growspace-manager-card.js:/config/www/growspace-manager-card.js
      - ./tests/test_camera.png:/config/www/test_camera.png
    ports:
      - "8123:8123"

  # --- New Fresh/Test Instance ---
  homeassistant-test-init:
    image: busybox
    volumes:
      - ha-config-test:/config
      # Map your specific test configuration here
      - ./tests/config/configs/configuration.yaml:/tmp/configuration.yaml:ro
    command: sh -c "[ ! -f /config/configuration.yaml ] && cp /tmp/configuration.yaml /config/ || true; chown -R 1000:1000 /config; chmod -R 755 /config"

  homeassistant-test:
    container_name: homeassistant-test
    image: homeassistant/home-assistant:stable
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - homeassistant-test-init
    environment:
      - TZ=America/Chicago
    volumes:
      - ha-config-test:/config
      # Mount only the integration folder so other custom components in the user's backup are preserved
      - ./custom_components/growspace_manager:/config/custom_components/growspace_manager
      # Mount Lovelace card for auto-updates
      - ../lovelace-growspace-manager-card/growspace-manager-card.js:/config/www/growspace-manager-card.js
    ports:
      - "8124:8123" # Access this instance via http://localhost:8124

volumes:
  ha-config:
  ha-config-test: # Separate volume to preserve fresh state independently
