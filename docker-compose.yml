---
services:
  # --- Existing Production/Dev Instance ---
  homeassistant-init:
    image: busybox
    volumes:
      - ha-config:/config
      - ./config/configuration.yaml:/tmp/configuration.yaml:ro
      - ./tests/fixtures/lovelace/growspace-manager-card.js:/tmp/growspace-manager-card.js:ro
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /config/www
        if [ ! -f /config/configuration.yaml ]; then
          cp /tmp/configuration.yaml /config/
        fi
        cp /tmp/growspace-manager-card.js \
          /config/www/growspace-manager-card.js
        chown -R 1000:1000 /config
        chmod -R 755 /config

  homeassistant:
    container_name: homeassistant-dev
    image: homeassistant/home-assistant:stable
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - homeassistant-init
    environment:
      - TZ=America/Chicago
    volumes:
      - ha-config:/config
      - ./custom_components:/config/custom_components
      - ./tests/test_camera.png:/config/www/test_camera.png
    ports:
      - "8123:8123"

  # --- New Fresh/Test Instance ---
  homeassistant-test-init:
    image: busybox
    volumes:
      - ha-config-test:/config
      # Map your specific test configuration here
      - ./tests/config/configs/configuration.yaml:/tmp/configuration.yaml:ro
      - ./tests/fixtures/lovelace/growspace-manager-card.js:/tmp/growspace-manager-card.js:ro
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /config/www
        if [ ! -f /config/configuration.yaml ]; then
          cp /tmp/configuration.yaml /config/
        fi
        cp /tmp/growspace-manager-card.js \
          /config/www/growspace-manager-card.js
        chown -R 1000:1000 /config
        chmod -R 755 /config

  homeassistant-test:
    container_name: homeassistant-test
    image: homeassistant/home-assistant:stable
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - homeassistant-test-init
    environment:
      - TZ=America/Chicago
    volumes:
      - ha-config-test:/config
      # Mount only the integration folder so components in restored backups
      # remain preserved.
      - ./custom_components/growspace_manager:/config/custom_components/growspace_manager
    ports:
      # Access this instance via http://localhost:8124
      - "8124:8123"

volumes:
  ha-config:
  # Separate volume to preserve fresh state independently
  ha-config-test:
