# Home Assistant Test Instance Configuration
# This configuration is used by the homeassistant-test Docker instance

# Basic configuration
---
homeassistant:
  name: Test Instance
  latitude: 41.8781
  longitude: -87.6298
  elevation: 181
  unit_system: metric
  time_zone: America/Chicago
  allowlist_external_dirs:
    - /config/www

# Enable the frontend
frontend:
  themes: !include_dir_merge_named themes

# Lovelace resources for custom cards
lovelace:
  mode: yaml
  resources:
    - url: /local/growspace-manager-card.js
      type: module

# Enable configuration UI
config:

# Enable system health
system_health:

# Enable HTTP component
http:

# Enable logging
logger:
  default: info
  logs:
    custom_components.growspace_manager: debug

# Enable history
history:

# Enable logbook
logbook:

# Recorder for storing sensor data
recorder:
  purge_keep_days: 7

# Template sensors for testing
template:
  - sensor:
      # Temperature sensor
      - name: "Test Temperature"
        unique_id: test_temperature_sensor
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ 22 + (range(0, 6) | random) }}

      # Humidity sensor
      - name: "Test Humidity"
        unique_id: test_humidity_sensor
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >
          {{ 55 + (range(0, 15) | random) }}

      # VPD sensor
      - name: "Test VPD"
        unique_id: test_vpd_sensor
        unit_of_measurement: "kPa"
        state_class: measurement
        state: >
          {{ (1.0 + (range(0, 5) | random) / 10) | round(2) }}

      # CO2 sensor
      - name: "Test CO2"
        unique_id: test_co2_sensor
        unit_of_measurement: "ppm"
        device_class: carbon_dioxide
        state_class: measurement
        state: >
          {{ 800 + (range(0, 400) | random) }}

      # Light sensor (PPFD)
      - name: "Test PPFD"
        unique_id: test_ppfd_sensor
        unit_of_measurement: "µmol/m²/s"
        state_class: measurement
        state: >
          {% set hour = now().hour %}
          {% if hour >= 6 and hour < 22 %}
            {{ 400 + (range(0, 200) | random) }}
          {% else %}
            0
          {% endif %}

      # Soil moisture sensor
      - name: "Test Soil Moisture"
        unique_id: test_soil_moisture_sensor
        unit_of_measurement: "%"
        device_class: moisture
        state_class: measurement
        state: >
          {{ 40 + (range(0, 30) | random) }}

      # --- New Sensors for EC and Drain Logic ---

      # Feed EC sensor
      - name: "Test Feed EC"
        unique_id: test_feed_ec_sensor
        unit_of_measurement: "mS/cm"
        device_class: conductivity
        state_class: measurement
        state: >
          {{ (2.0 + (range(0, 10) | random) / 10) | round(2) }}

      # Substrate EC sensor
      - name: "Test Substrate EC"
        unique_id: test_substrate_ec_sensor
        unit_of_measurement: "mS/cm"
        device_class: conductivity
        state_class: measurement
        state: >
          {{ (2.5 + (range(0, 15) | random) / 10) | round(2) }}

      # Runoff EC sensor
      - name: "Test Runoff EC"
        unique_id: test_runoff_ec_sensor
        unit_of_measurement: "mS/cm"
        device_class: conductivity
        state_class: measurement
        state: >
          {{ (3.0 + (range(0, 20) | random) / 10) | round(2) }}

      # PH sensor
      - name: "Test PH"
        unique_id: test_ph_sensor
        device_class: ph
        state_class: measurement
        state: >
          {{ (5.8 + (range(0, 10) | random) / 20) | round(2) }}

      # Drain Volume sensor
      - name: "Test Drain Volume"
        unique_id: test_drain_volume_sensor
        unit_of_measurement: "mL"
        state_class: measurement
        state: >
          {{ (range(100, 500) | random) }}

      # Tank Level sensor
      - name: "Test Tank Level"
        unique_id: test_tank_level_sensor
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ (range(50, 100) | random) }}

      # Power Usage sensor
      - name: "Test Power Usage"
        unique_id: test_power_usage_sensor
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (range(200, 1000) | random) }}

      # Energy Consumption sensor
      - name: "Test Energy Consumption"
        unique_id: test_energy_consumption_sensor
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ (range(100, 1000) | random) / 10 }}

      # Irrigation Flow sensor
      - name: "Test Irrigation Flow"
        unique_id: test_irrigation_flow_sensor
        unit_of_measurement: "mL/s"
        state_class: measurement
        state: >
          {{ (range(10, 50) | random) }}
