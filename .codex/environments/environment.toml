# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "growspace_manager"

[setup]
script = ""

[setup.linux]
script = '''
set -euo pipefail

COMMON_GIT_DIR="$(git rev-parse --path-format=absolute --git-common-dir)"
MAIN_CHECKOUT="$(dirname "$COMMON_GIT_DIR")"
SHARED_VENV="$MAIN_CHECKOUT/.venv"
REQUIREMENTS_HASH="$(sha256sum requirements.txt | cut -d' ' -f1)"
STAMP="$SHARED_VENV/.requirements-$REQUIREMENTS_HASH"

(
  flock 9

  if [ ! -x "$SHARED_VENV/bin/python" ]; then
    python3 -m venv "$SHARED_VENV"
    "$SHARED_VENV/bin/python" -m pip install --upgrade pip setuptools wheel
  fi

  if [ ! -f "$STAMP" ]; then
    HA_REQUIREMENT="$(
      sed -n 's/^\(homeassistant==[^[:space:]]*\).*$/\1/p' requirements.txt
    )"

    "$SHARED_VENV/bin/python" -m pip install "$HA_REQUIREMENT"

    HA_CONSTRAINTS="$(
      "$SHARED_VENV/bin/python" -c \
        'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt")'
    )"

    "$SHARED_VENV/bin/python" -m pip install \
      -r requirements.txt \
      -c "$HA_CONSTRAINTS"

    touch "$STAMP"
  fi
) 9>/tmp/growspace-manager-venv.lock

ln -sfnT "$SHARED_VENV" .venv'''

[[actions]]
name = "Test"
icon = "tool"
command = '''
# Test
./.venv/bin/pytest -q'''
platform = "linux"

[[actions]]
name = "Coverage"
icon = "tool"
command = '''
# Coverage
./.venv/bin/pytest --cov=custom_components.growspace_manager \
  --cov-report=term-missing -q'''

[[actions]]
name = "Lint"
icon = "tool"
command = '''
# Lint
./.venv/bin/ruff check custom_components/ tests/'''
