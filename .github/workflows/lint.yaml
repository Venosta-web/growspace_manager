---
name: Lint

"on":
  # Feature branches are validated by pull_request. Restrict push validation to
  # protected branches so a same-repository PR commit does not run twice.
  push:
    branches:
      - prerelease
      - dev
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel only an older run for this workflow and this PR. Push and manual
  # runs keep their branch/ref group and are never cancelled here.
  group: >-
    validation-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        name: Setup Python
        with:
          python-version: "3.14"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade \
            "$(grep '^pre-commit==' requirements.txt)" \
            "$(grep '^ruff==' requirements.txt)" \
            "$(grep '^yamllint==' requirements.txt)" \
            "$(grep '^codespell==' requirements.txt)"
      - name: Check lint tool pins and hooks
        run: python .github/scripts/check_lint_tool_pins.py
      # Invoke the checked-in hook rather than duplicating its codespell options
      # here, so commits and CI enforce exactly the same spelling configuration.
      # Keeping this in the required Ruff job also makes spelling a merge gate.
      - name: Check spelling
        run: pre-commit run codespell --all-files
      - name: Check YAML style
        run: pre-commit run yamllint --all-files
      - name: ruff check
        run: ruff check custom_components/ tests/
      - name: ruff format --check
        run: ruff format --check custom_components/ tests/

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        name: Setup Python
        with:
          python-version: "3.14"
          cache: "pip"
      # Two-phase constrained install, matching tests.yaml — see the comment
      # there.
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep '^homeassistant==' requirements.txt)"
          constraints_file="$(
            python -c 'import homeassistant, pathlib; print(
              pathlib.Path(homeassistant.__file__).parent
              / "package_constraints.txt"
            )'
          )"
          pip install -r requirements.txt -c "$constraints_file"
      - name: mypy
        run: mypy --follow-imports=silent custom_components/
