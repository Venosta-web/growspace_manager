---
name: Release

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stable-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Update version in manifest.json
        id: version_step
        run: |
          MANIFEST="custom_components/growspace_manager/manifest.json"
          VERSION="$(jq -r .version "$MANIFEST")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected stable X.Y.Z manifest version, got $VERSION" >&2
            exit 1
          fi
          echo "Publishing version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version_step.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 2. Creates the ZIP file
      - name: ZIP Release
        if: steps.check_release.outputs.exists != 'true'
        run: python3 .github/scripts/build_release_archive.py

      # 3. Creates the GitHub Release and attaches the new zip file
      - name: Create Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ steps.version_step.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            growspace_manager.zip
          fail_on_unmatched_files: true

      - name: Verify release tag
        if: steps.check_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version_step.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          tag_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq .object.sha
          )"
          if [ "$tag_sha" != "$TARGET_SHA" ]; then
            echo \
              "Tag $TAG_NAME points to $tag_sha; expected $TARGET_SHA" \
              >&2
            exit 1
          fi
