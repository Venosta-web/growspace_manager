---
name: Release

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stable-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Update version in manifest.json
        id: version_step
        run: |
          MANIFEST="custom_components/growspace_manager/manifest.json"
          BASE_VERSION="$(jq -r .version "$MANIFEST")"
          VERSION="$(
            python3 .github/scripts/prerelease_version.py \
              --stable "$BASE_VERSION"
          )"
          echo "Updating version to $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd custom_components/growspace_manager
          # Use jq to reliably update the version
          if ! jq --arg v "$VERSION" '.version = $v' manifest.json \
            > manifest.json.tmp; then
            echo "jq command failed"
            exit 1
          fi
          mv manifest.json.tmp manifest.json
          cd ../..

      - name: Commit stable version
        id: stable_commit
        env:
          VERSION: ${{ steps.version_step.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add custom_components/growspace_manager/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to v$VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 2. Creates the ZIP file
      - name: ZIP Release
        run: |
          cd custom_components/growspace_manager
          zip -r ../../growspace_manager.zip . \
            -x ".github/*" \
            -x ".coverage" \
            -x ".gitignore" \
            -x "pytest.ini" \
            -x "module.json"

      # 3. Creates the GitHub Release and attaches the new zip file
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ steps.version_step.outputs.version }}
          target_commitish: ${{ steps.stable_commit.outputs.sha }}
          generate_release_notes: true
          files: |
            growspace_manager.zip
          fail_on_unmatched_files: true

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.version_step.outputs.version }}
          TARGET_SHA: ${{ steps.stable_commit.outputs.sha }}
        run: |
          tag_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
              --jq .object.sha
          )"
          if [ "$tag_sha" != "$TARGET_SHA" ]; then
            echo \
              "Tag $TAG_NAME points to $tag_sha; expected $TARGET_SHA" \
              >&2
            exit 1
          fi
