---
name: Tests

"on":
  # Feature branches are validated by pull_request. Restrict push validation to
  # protected branches so a same-repository PR commit does not run twice.
  push:
    branches:
      - prerelease
      - dev
      - main
  pull_request:

concurrency:
  # Cancel only an older run for this workflow and this PR. Protected-branch
  # push runs keep their ref group and are never cancelled here.
  group: >-
    validation-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.0.0
        name: Setup Node.js
        with:
          node-version: "24"
      - name: Test branch maintenance safeguards
        run: node --test .github/scripts/branch-cleanup.test.cjs
      - uses: actions/setup-python@v6.2.0
        name: Setup Python
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Cache pip
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/pip
          # The cache key depends on the OS and the contents of requirements.txt
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: update pip
        run: python -m pip install --upgrade pip setuptools wheel
      # Two-phase install so every Home-Assistant-owned dependency resolves to
      # the version this HA release actually supports. Installing
      # requirements.txt in one unconstrained pass let hassil float past HA
      # 2026.5.4 and zeroed out collection on a commit that had passed a month
      # earlier (ADR-0020, 2026-08-07 amendment).
      - name: install dependencies
        # yamllint disable rule:line-length
        run: |
          # Phase 1: install HA so its constraints are available for phase 2.
          pip install "$(grep '^homeassistant==' requirements.txt)"
          pip install -r requirements.txt -c "$(
            python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt")'
          )"
        # yamllint enable rule:line-length
      # Expose the resolved set so time-dependent failures can be compared.
      - name: record resolved dependency set
        run: pip freeze
      - name: Run Unit Tests
        run: >-
          pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
